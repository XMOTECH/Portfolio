name: CI/CD Portfolio Pipeline

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: xmotech/portfolio
  GITOPS_REPO: XMOTECH/gitops-labs
  GITOPS_BRANCH: main
  DEPLOY_PATH: apps/portfolio/base/deployment.yaml

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      # 1. Récupération du code source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configuration de l'environnement Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Installation propre et vérification du build Angular
      - name: Install dependencies & test build
        run: |
          npm ci
          npm run build

      # 4. Configuration de Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Authentification GHCR
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Extraction des métadonnées (tags, labels)
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=

      # 7. Construction et publication de l'image sur GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 8. Récapitulatif du build
      - name: Summary
        run: |
          echo "### 🚀 Image publiée avec succès sur GHCR !" >> $GITHUB_STEP_SUMMARY
          echo "Tag : \`${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────────
  # JOB 2 : Mise à jour automatique du dépôt GitOps (gitops-labs)
  # ──────────────────────────────────────────────────────────────
  update-gitops:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      # 1. Cloner le dépôt GitOps
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: ${{ env.GITOPS_BRANCH }}

      # 2. Mettre à jour le tag de l'image dans deployment.yaml
      - name: Update image tag in deployment
        run: |
          NEW_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}"
          echo "Nouvelle image : $NEW_IMAGE"

          # Remplace la ligne 'image:' dans le fichier deployment.yaml
          sed -i "s|image: .*|image: ${NEW_IMAGE}|" ${{ env.DEPLOY_PATH }}

          echo "Contenu mis à jour :"
          grep "image:" ${{ env.DEPLOY_PATH }}

      # 3. Committer et pousser vers gitops-labs
      - name: Commit and push to GitOps repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.DEPLOY_PATH }}
          git diff --cached --quiet && echo "Aucun changement détecté" && exit 0
          git commit -m "chore(ci): update portfolio image to ${{ needs.build-and-push.outputs.image_tag }}"
          git push

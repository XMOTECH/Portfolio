name: CI Portfolio Pipeline

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Récupération du code source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configuration de l'environnement Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Installation propre et vérification du build Angular
      - name: Install dependencies & test build
        run: |
          npm ci
          npm run build

      # 4. Configuration de Docker Buildx (pour builds multi-plateformes rapides)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Authentification auprès de GitHub Container Registry (GHCR)
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Extraction des métadonnées (tags, labels)
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest

      # 7. Construction et publication de l'image sur GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 8. Récapitulatif du build
      - name: Summary
        run: |
          echo "### 🚀 Image publiée avec succès sur GHCR !" >> $GITHUB_STEP_SUMMARY
          echo "Tags générés :" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY

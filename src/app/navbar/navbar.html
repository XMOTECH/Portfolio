<nav class="navbar">
  <div class="navbar__logo">
    <span class="logo-name">{{ title() }}</span>
  </div>

  <ul class="navbar__links">
    @for (link of navLinks(); track link.path) {
      <li>
        <a [routerLink]="link.path"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }">
          {{ link.label }}
        </a>
      </li>
    }
  </ul>
</nav>
